<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#2f5f4f" />
  <title>카페 주문 연습</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <a class="skip-link" href="#practice-main">주문 연습으로 바로 가기</a>

  <div class="site-shell">
    <header class="site-header" aria-label="카페 주문 연습">
      <div class="brand" aria-label="카페 주문 연습 홈">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 48 48" role="img">
            <path d="M10 16h25v14a10 10 0 0 1-10 10h-5A10 10 0 0 1 10 30V16Z" fill="currentColor" opacity=".16"/>
            <path d="M35 20h3a6 6 0 0 1 0 12h-3" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
            <path d="M15 11c0-2 2-3 2-5M23 11c0-2 2-3 2-5M31 11c0-2 2-3 2-5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
          </svg>
        </span>
        <div>
          <p class="brand-kicker">생활 연습</p>
          <h1>카페 주문 연습</h1>
        </div>
      </div>
      <button id="restartTopButton" class="text-button is-hidden" type="button">처음부터</button>
    </header>

    <main id="practice-main" class="app-main" tabindex="-1">
      <section id="progressRegion" class="progress-region is-hidden" aria-label="주문 진행 단계">
        <ol class="progress-list" id="progressList"></ol>
      </section>

      <div id="practiceLayout" class="practice-layout practice-layout--single">
        <section id="screen" class="screen-card" aria-live="polite" aria-atomic="false"></section>
        <aside id="orderSummary" class="order-summary is-hidden" aria-label="현재 주문 내용"></aside>
      </div>
    </main>

    <footer class="site-footer">
      <p>천천히 선택해도 괜찮다. 주문을 끝내기 전에는 언제든 다시 고를 수 있다.</p>
    </footer>
  </div>

  <div id="liveRegion" class="sr-only" aria-live="polite" aria-atomic="true"></div>

  <noscript>
    <div class="noscript-message">이 주문 연습은 자바스크립트가 켜져 있어야 사용할 수 있다.</div>
  </noscript>

  <script src="script.js"></script>
</body>
</html>
